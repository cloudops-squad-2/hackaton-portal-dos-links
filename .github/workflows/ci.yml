name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASENAME: portal-dos-links
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.21.2"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose

  # ---------------------------------------------------------------
  # SAST (Semgrep) — non-blocking, runs in parallel with other jobs.
  # Deliberately excluded from the `needs` of `build` so a false
  # positive never blocks a deploy.
  # ---------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/nodejs
            p/secrets
        continue-on-error: true

  # ---------------------------------------------------------------
  # API (TypeScript)
  # ---------------------------------------------------------------
  test-api:
    name: API tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Compile TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------
  # Frontend (React + Vite)
  # ---------------------------------------------------------------
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # --ignore-scripts prevents malicious postinstall execution
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

  # ---------------------------------------------------------------
  # Build images (api, frontend)
  # ---------------------------------------------------------------
  build:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: [gitleaks, test-api, test-frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name and tag
        run: |
          # GHCR requires lowercase image names.
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${REGISTRY}/${OWNER}/${IMAGE_BASENAME}-${{ matrix.service }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.SHORT_SHA }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------
  # GitOps handoff: write the new image tag into the config repo.
  # ArgoCD detects the diff and deploys automatically.
  # Requires CONFIG_REPO_PAT secret (write access to the gitops repo).
  # ---------------------------------------------------------------
  update-manifests:
    name: Update GitOps repo
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize bumps — prevents race when two commits land in quick succession.
    concurrency:
      group: gitops-update
      cancel-in-progress: false
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hackaton-portal-dos-links-gitops
          ref: main
          token: ${{ secrets.CONFIG_REPO_PAT }}

      - name: Bump image tags
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in api frontend; do
            NAME="${REGISTRY}/${OWNER}/${IMAGE_BASENAME}-${svc}" TAG="${GITHUB_SHA::7}" \
              yq -i '(.images[] | select(.name == strenv(NAME))).newTag = strenv(TAG)' k8s/kustomization.yaml
          done

      - name: Open PR
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy/${GITHUB_SHA::7}
          git commit -am "chore(deploy): bump images to ${GITHUB_SHA::7}"
          git push origin deploy/${GITHUB_SHA::7}
          gh pr create \
            --title "chore(deploy): bump images to ${GITHUB_SHA::7}" \
            --body "Automated image bump triggered by ${{ github.repository }}@${GITHUB_SHA::7}" \
            --base main \
            --head deploy/${GITHUB_SHA::7}
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
