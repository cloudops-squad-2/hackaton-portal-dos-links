# nginx.conf — Encolhe! Frontend
#
# Responsabilidades deste arquivo:
#   1. Servir o bundle SPA do Vite com fallback para index.html
#   2. Expor /health para healthcheck do container
#   3. (Opcional) Fazer proxy de /api/* para o backend
#
# Roteamento — IMPORTANTE lembrar à equipe:
#   O backend NestJS também trata rotas como /:code (redirecionamento).
#   Este nginx serve SOMENTE o bundle estático do frontend.
#   O roteamento de /:code deve ser tratado pelo reverse proxy da equipe
#   (Nginx/Traefik/Ingress do cluster) ANTES de chegar a este container.
#   NÃO configure aqui um proxy para /:code sem definir regras claras
#   para evitar conflito com as rotas do frontend (ex.: /sobre, /meus-links).
#
# Pendências de definição com a equipe (D6):
#   - Endereço e porta real do backend para proxy de /api
#   - Estratégia de TLS (encerramento no Ingress ou aqui)
#   - Política de cache para assets com hash de conteúdo

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos básicos; políticas mais restritas devem ser avaliadas no Ingress.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Compressão ───────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/html
        text/css
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;

    # ── Healthcheck do container (D3) ─────────────────────────────────────
    # Responde 200 apenas para indicar que o nginx está vivo.
    # NÃO verifica a disponibilidade da API — isso é responsabilidade
    # do healthcheck do serviço de backend.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── Assets com hash de conteúdo (cache agressivo) ─────────────────────
    # Vite gera nomes como main-Abc123.js — são imutáveis por design.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Imagens e SVGs ────────────────────────────────────────────────────
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Proxy para a API do backend (/api) ────────────────────────────────
    # Em desenvolvimento o proxy é feito pelo Vite (vite.config.ts).
    # Em produção, descomente e ajuste o endereço do backend.
    # O reverse proxy da equipe pode também cuidar disso antes deste nginx.
    #
    # location /api/ {
    #     proxy_pass http://BACKEND_HOST:BACKEND_PORT/api/;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     # Propagação de contexto OpenTelemetry (D5 — habilitar após alinhamento):
    #     # proxy_set_header traceparent $http_traceparent;
    #     # proxy_set_header tracestate  $http_tracestate;
    # }

    # HTML deve ser revalidado a cada implantação para carregar os novos assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    # Qualquer rota não resolvida como arquivo estático retorna index.html.
    # O React Router (se adicionado no futuro) ou a lógica do App lidam
    # com as rotas no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
