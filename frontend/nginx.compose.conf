# nginx.compose.conf — Encolhe! Frontend
# Configuracao especifica para o Docker Compose.
# O nginx.conf original permanece reservado para o Kubernetes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabecalhos basicos de seguranca
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

   # Compressao
   gzip on;
   gzip_types
     text/css
     application/javascript
     application/json
     image/svg+xml;

    # Healthcheck do frontend
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: preserva o prefixo /api
    # Exemplo: /api/links -> http://api:3000/api/links
    location ^~ /api/ {
        proxy_pass http://api:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Propagação de contexto OpenTelemetry (REQ-OBS-02):
        # o browser injeta traceparent via FetchInstrumentação; repassamos
        # explicitamente para a API continuar a mesma trace.
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate  $http_tracestate;
    }

    # Links curtos: remove o prefixo /s/
    # Exemplo: /s/ABC123 -> http://api:3000/ABC123
    location ^~ /s/ {
        proxy_pass http://api:3000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Propagação de contexto OpenTelemetry (redirecionamento de link curto).
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate  $http_tracestate;
    }

    # Arquivos estaticos do Vite
    location ~* \.(?:js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imagens e icones
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Evita manter HTML antigo em cache
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Frontend React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
