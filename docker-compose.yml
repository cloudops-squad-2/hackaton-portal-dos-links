services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portal-net

  migration:
    build:
      context: ./api
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - portal-net

  api:
    build:
      context: ./api
    ports:
      - "3000:3000"
      - "4317:4317"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-portal-dos-links-api}
      PORT: "3000"
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - portal-net

  frontend:
    build:
      context: ./frontend
      args:
        # VITE_* é incorporado ao bundle em tempo de build (não em runtime).
        # VITE_OTEL_EXPORTER_URL precisa ser alcançável pelo navegador do
        # usuário — por isso aponta para a porta do host, não para o hostname
        # interno do Docker.
        VITE_OTEL_ENABLED: ${VITE_OTEL_ENABLED:-true}
        VITE_OTEL_SERVICE_NAME: ${VITE_OTEL_SERVICE_NAME:-encolhe-frontend}
        VITE_OTEL_EXPORTER_URL: ${VITE_OTEL_EXPORTER_URL:-http://localhost:4318/v1/traces}
    ports:
      - "80:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - portal-net

networks:
  portal-net:
    driver: bridge

volumes:
  postgres_data:
