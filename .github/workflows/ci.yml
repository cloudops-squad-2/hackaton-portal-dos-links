name: CI

on:
  push:
    branches: ["main"]
    # Skip the bot's own tag bump to avoid a build loop
    paths-ignore:
      - "k8s/kustomization.yaml"
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_BASENAME: portal-dos-links
  # Pinned tool versions
  NODE_VERSION: "22"
  KUSTOMIZE_VERSION: "5.4.3"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # API (TypeScript)
  # ---------------------------------------------------------------
  test-api:
    name: API tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------
  # Build images (api, frontend)
  # Keep both images built on every commit; no path filters.
  # ---------------------------------------------------------------
  build:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: [gitleaks, test-api]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name and tag
        run: |
          # GHCR requires lowercase image names.
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${REGISTRY}/${OWNER}/${IMAGE_BASENAME}-${{ matrix.service }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.SHORT_SHA }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------
  # GitOps: bump image tags (ArgoCD syncs the commit)
  # ---------------------------------------------------------------
  update-manifests:
    name: Bump image tags
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # Serialize bumps so two merges in a row cannot race on the push.
    concurrency:
      group: update-manifests
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Install Kustomize
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: Set image tags
        working-directory: k8s
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          TAG="${GITHUB_SHA::7}"
          for svc in api frontend; do
            IMAGE="${REGISTRY}/${OWNER}/${IMAGE_BASENAME}-${svc}"
            kustomize edit set image "${IMAGE}=${IMAGE}:${TAG}"
          done

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: bump images to ${GITHUB_SHA::7} [skip ci]"
          git push